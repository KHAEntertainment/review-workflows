# Shared PR-Agent reviewer (reusable workflow).
#
# Called from a tiny stub in each repo (see stub/.github/workflows/ai-review.yml).
# Routing, all decided here so the stubs never need to change:
#
#   PRIVATE repo  -> PR-Agent is the primary reviewer: review + improve on open,
#                    re-review on every push, and /commands from the repo owner.
#   PUBLIC repo   -> CodeRabbit stays primary. PR-Agent runs only when CodeRabbit
#                    posts its rate-limit notice, or when you run it manually.
#
# Model: MiniMax-M3 via your Token Plan key (repo secret MINIMAX_API_KEY).

name: PR-Agent (shared)

on:
  workflow_call:
    inputs:
      pr_number:
        description: "PR number for a manual run (workflow_dispatch in the stub)"
        type: string
        required: false
        default: ""
    secrets:
      # Passed explicitly by the stub, so no other repo secrets reach this workflow.
      MINIMAX_API_KEY:
        required: false

env:
  # One place to change the model for every repo.
  PRA_MODEL: minimax/MiniMax-M3
  PRA_MAX_TOKENS: "200000"
  # Pinned by digest (pragent/pr-agent:0.46.0) because the container receives
  # MINIMAX_API_KEY and a write token. Bump together with the action pin below.
  PR_AGENT_IMAGE: pragent/pr-agent@sha256:3b039b143c221fff76a09fbfc2c81292662ad86bd6d304123ccbb22b00ecb114

jobs:
  # ---------------------------------------------------------------------------
  # 1) Private repos: PR-Agent as the primary reviewer.
  #    Also handles "/review", "/improve", "/ask ..." etc. typed by the repo owner
  #    on any repo. MEMBER/COLLABORATOR comments are ignored so only the owner
  #    can spend the MiniMax key.
  # ---------------------------------------------------------------------------
  primary:
    if: >-
      (github.event_name == 'pull_request' && github.event.repository.private &&
       github.event.pull_request.draft == false &&
       github.event.pull_request.user.login != 'dependabot[bot]')
      ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       github.event.sender.type != 'Bot' &&
       startsWith(github.event.comment.body, '/') &&
       github.event.comment.author_association == 'OWNER')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pr-agent-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: PR-Agent
        # v0.46.0, pinned by commit SHA. Note: this action builds FROM the mutable
        # tag pragent/pr-agent:github_action, so its image is not digest-pinned.
        uses: the-pr-agent/pr-agent@1d01f24f455bb879c1d9c557ad7de3d72dcc7975 # v0.46.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          config.model: ${{ env.PRA_MODEL }}
          config.fallback_models: '["${{ env.PRA_MODEL }}"]'
          config.custom_model_max_tokens: ${{ env.PRA_MAX_TOKENS }}
          # Your agents write the PR title/body, so don't let /describe overwrite them.
          github_action_config.auto_describe: "false"
          github_action_config.auto_review: "true"
          github_action_config.auto_improve: "true"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review"]'
          # Re-review after each push, like CodeRabbit's incremental reviews.
          github_action_config.handle_push_trigger: "true"
          github_action_config.push_commands: '["/review"]'

  # ---------------------------------------------------------------------------
  # 2) Public repos: fallback when CodeRabbit is rate-limited or its review
  #    fails, or a manual run. PR-Agent's own action ignores bot comments, so
  #    run its CLI image directly.
  #    Trigger: a CodeRabbit comment, created or edited, containing any notice
  #    phrase. Edits count: CodeRabbit re-renders one summary comment, so a new
  #    notice often arrives as an edit of a comment that already had an old one.
  #    Dedupe is by head commit instead (the "Once per head commit" step).
  # ---------------------------------------------------------------------------
  coderabbit-fallback:
    if: >-
      inputs.pr_number != ''
      ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       github.event.comment.user.login == 'coderabbitai[bot]' &&
       (contains(github.event.comment.body, 'rate limited by coderabbit.ai') ||
        contains(github.event.comment.body, 'Review limit reached') ||
        contains(github.event.comment.body, 'Rate limit exceeded') ||
        contains(github.event.comment.body, 'Review rate limited') ||
        contains(github.event.comment.body, 'Review failed')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      # Queued, never cancelled, so the guard below sees the previous run's marker.
      group: pr-agent-fallback-${{ github.repository }}-${{ inputs.pr_number || github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # Run at most once per PR head commit. A manual run always proceeds (it is
      # an explicit request) but still records its marker. A notice-triggered
      # run skips when this head already has a fallback marker, or when
      # CodeRabbit has since submitted a review on this head.
      - name: Once per head commit
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.issue.number }}
          MANUAL: ${{ inputs.pr_number != '' }}
        run: |
          set -euo pipefail
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::PR number must be digits"; exit 1
          fi
          head="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha)"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          marker="<!-- review-workflows:pr-agent-fallback head=$head -->"
          if [[ "$MANUAL" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          done_before="$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
            | jq -s --arg m "$marker" '[.[][] | select(.user.login == "github-actions[bot]" and (.body | contains($m)))] | length')"
          cr_reviewed="$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/reviews" \
            | jq -s --arg h "$head" '[.[][] | select(.user.login == "coderabbitai[bot]" and .commit_id == $h)] | length')"
          if (( done_before > 0 )); then
            echo "Fallback already ran for head $head; skipping."; echo "run=false" >> "$GITHUB_OUTPUT"
          elif (( cr_reviewed > 0 )); then
            echo "CodeRabbit already reviewed head $head; skipping."; echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run PR-Agent review + improve
        if: steps.guard.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          PR_URL: ${{ github.server_url }}/${{ github.repository }}/pull/${{ inputs.pr_number || github.event.issue.number }}
        run: |
          set -euo pipefail
          echo "Fallback review for $PR_URL"
          for cmd in review improve; do
            docker run --rm \
              -e GITHUB__USER_TOKEN="$GITHUB_TOKEN" \
              -e MINIMAX_API_KEY \
              -e CONFIG__MODEL="$PRA_MODEL" \
              -e CONFIG__FALLBACK_MODELS="[\"$PRA_MODEL\"]" \
              -e CONFIG__CUSTOM_MODEL_MAX_TOKENS="$PRA_MAX_TOKENS" \
              -e PR_REVIEWER__EXTRA_INSTRUCTIONS="Note: CodeRabbit was rate-limited on this PR; this is the backup review." \
              "$PR_AGENT_IMAGE" --pr_url "$PR_URL" "$cmd"
          done

      - name: Record fallback marker for this head
        if: steps.guard.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.issue.number }}
          HEAD_SHA: ${{ steps.guard.outputs.head }}
        run: |
          set -euo pipefail
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "<!-- review-workflows:pr-agent-fallback head=$HEAD_SHA -->
          PR-Agent backup review ran for \`${HEAD_SHA:0:7}\`. Later CodeRabbit notices for this commit will not re-run it."
